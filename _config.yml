title: Omezy Journal
tagline: Omegle chat guides to talk to a stranger
description: Omezy Journal on omezy.info — guides for Omegle chat on Omezy. Talk to a stranger by text, voice, or video, with safety and etiquette. 18+.
url: https://omezy.info
baseurl: ""
lang: en
timezone: UTC
future: false
markdown: kramdown
kramdown:
  input: GFM
permalink: /:slug/
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

main_site: https://omezy.net/
chat_url: https://omezy.net/
safety_url: https://omezy.net/safety-tips.html

google_analytics: G-W6K41T3S0F

author:
  name: Omezy Journal
  default_writer: Omezy Journal

social:
  name: Omezy Journal
  links:
    - https://omezy.net/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      full_width: true
      author: Omezy Journal
      author_slug: omezy-journal
  - scope:
      path: ""
      type: pages
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - DEPLOY.md
  - qa-posts.py
  - preview.sh
  - vendor
  - .bundle
